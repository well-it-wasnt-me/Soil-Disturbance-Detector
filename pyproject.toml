[build-system]
requires = ["setuptools>=69", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "dgd"
# From the latest vX.Y.Z git tag, never typed in by hand. See docs/releasing.md.
dynamic = ["version"]
description = "Find illegal dumping, waste burning and digging in free Sentinel-2 imagery. Leads, not evidence."
readme = "README.md"
license = { text = "CC0-1.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "rasterio>=1.3.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "pystac-client>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ee = ["earthengine-api", "geemap"]
dev = ["pytest>=8", "pytest-cov"]
docs = ["mkdocs"]

[project.scripts]
dgd = "dgd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgd = ["ui/*.html", "ui/*.js", "ui/*.css", "data/*.geojson"]

[tool.setuptools_scm]
# At a vX.Y.Z tag the version is X.Y.Z. Past it, X.Y.(Z+1).devN+g<commit>.
version_file = "src/dgd/_version.py"
fallback_version = "0.0.0"  # no git and no archive metadata: still builds

[tool.setuptools_scm.scm.git]
# Only vX.Y.Z tags are releases. Any other tag (v.1.0.1, nightly) is ignored
# instead of failing the build.
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*.[0-9]*.[0-9]*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the internet (Earth Search, WorldCover). Run with -m network."]
addopts = "-m 'not network'"
