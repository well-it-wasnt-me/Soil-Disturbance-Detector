[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dgd"
version = "0.2.0"
description = "Find illegal dumping, waste burning and digging in free Sentinel-2 imagery. Leads, not evidence."
readme = "README.md"
license = { text = "CC0-1.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "rasterio>=1.3.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "pystac-client>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ee = ["earthengine-api", "geemap"]
dev = ["pytest>=8", "pytest-cov"]
docs = ["mkdocs"]

[project.scripts]
dgd = "dgd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgd = ["ui/*.html", "data/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the internet (Earth Search, WorldCover). Run with -m network."]
addopts = "-m 'not network'"
